version: '3.8'

services:
  db:
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=propertyflow
    ports:
      - "5433:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/propertyflow
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=debug_challenge_secret
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80" # Mapping internal 80 (nginx) to 3000
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  redis:
    image: redis:alpine
    ports:
      - "6380:6379" # Maps internal 6379 to host 6380 to avoid local conflicts

volumes:
  pgdata:
